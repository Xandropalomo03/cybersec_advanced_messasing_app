# Pipeline voor websec-unbreakable (Opdracht 2, stap 2).
#
# Elke scan geeft aan welke DSOMM-activiteit hij invult:
#
#   sca      -> Test and Verification / Static depth for applications:
#               "Software Composition Analysis (server side)"           (L2)
#   sast     -> Test and Verification / Static depth for applications:
#               "Static analysis for important server side components"  (L3, C#)
#               "Static analysis for important client side components"  (L3, SPA)
#   secrets  -> Test and Verification / Static depth for infrastructure:
#               "Test for stored secrets in code"                       (L1)
#   tests    -> Test and Verification / Application tests:
#               "Security integration tests for important components"   (L3)
#               Dynamic depth for applications: "Usage of different roles" (L2)
#               Test-Intensity: "Regular automated tests"               (L2)
#   container-> Test and Verification / Static depth for infrastructure:
#               "Test of virtualized environments"                      (L2, CVE's in het image)
#               "Test the definition of virtualized environments"       (L2, het Dockerfile)
#               Application hardening: "Containers are running as non-root" (L2, hier gecontroleerd)
#   gate     -> Test and Verification / Consolidation:
#               "Treatment of defects with high or critical severity"   (L1)
#               "Simple false positive treatment"                       (L1)
#
# Bijkomend, door de manier van bouwen:
#   - dotnet restore --locked-mode + acties vastgepind op commit-SHA
#     -> Build / "Pinning of artifacts" (L2)
#   - scans lopen op een schone, wegwerp GitHub-hosted runner
#     -> Build / "Building and testing of artifacts in virtualized environments" (L2)
#
# Wat is "kritiek"? (eigen keuze, zie scripts/security_gate.py)
#   SCA: High of Critical | SAST: security-severity >= 7.0 | Secrets: alles
#   Container: HIGH/CRITICAL CVEs, root user, exposed secrets
#
# De scans falen zelf nooit op een bevinding. Enkel de job "gate" beslist, zodat
# aanvaarde bevindingen (.security/accepted-findings.json) op 1 plek beheerd worden.

name: pipeline

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Standaard enkel lezen. Jobs krijgen niet meer dan dat.
permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  SAST_MIN_SCORE: "7.0"
  GITLEAKS_VERSION: "8.30.1"
  # sha256 van gitleaks_8.30.1_linux_x64.tar.gz, gelijk aan de officiele checksums.txt van de release
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # Trivy: vaste versie van de binary, geen derde-partij-actie. In maart 2026 werden bijna alle tags van
  # aquasecurity/trivy-action naar kwaadaardige code verplaatst (CVE-2026-33634). Een tag is veranderbaar.
  TRIVY_VERSION: "0.74.0"
  # sha256 van trivy_0.74.0_Linux-64bit.tar.gz, gelijk aan de officiele checksums.txt van de release
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"

jobs:
  sca:
    name: SCA (NuGet audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Vergrendeld op packages.lock.json: een afwijkende versie laat de restore falen.
      - name: Restore
        run: dotnet restore app/Unbreakable.csproj --locked-mode

      - name: Kwetsbare packages (inclusief transitieve)
        run: dotnet list app/Unbreakable.csproj package --vulnerable --include-transitive --format json > sca.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sca
          path: sca.json
          if-no-files-found: error
          retention-days: 14

  sast:
    name: SAST (CodeQL, ${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # CodeQL leest enkel zijn eigen instellingen via de API; schrijven doet hij niet (upload: never).
    permissions:
      contents: read
      security-events: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            codeql-config: |
              paths-ignore:
                - app/wwwroot/lib
              queries:
                - uses: ./.github/codeql/custom-queries/csharp
          - language: javascript-typescript
            codeql-config: |
              paths-ignore:
                - app/wwwroot/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@88585263c0627ee42c0e1c5143a112c8d6f4aa18 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: ${{ matrix.codeql-config }}

      # upload: never -> de resultaten gaan niet naar het Security-tabblad (dat laat
      # de pipeline toch niet falen), maar naar een SARIF-bestand voor onze poort.
      # Staat "Code scanning default setup" aan in je repo-instellingen? Zet het uit,
      # anders botst het met deze workflow.
      - uses: github/codeql-action/analyze@88585263c0627ee42c0e1c5143a112c8d6f4aa18 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif-results

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-${{ matrix.language }}
          path: sarif-results/*.sarif
          if-no-files-found: error
          retention-days: 14

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # ook de geschiedenis: een geheim dat verwijderd is, blijft in git
          persist-credentials: false

      - name: Gitleaks installeren (vaste versie, checksum gecontroleerd)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      # --redact: het rapport wordt als artifact bewaard en dat is publiek in een publieke repo.
      # --exit-code 0: de poort beslist, niet de scan. Een echte fout van gitleaks laat de stap wel falen.
      # --config .gitleaks.toml: custom regels voor connection strings, Docker env vars, etc.
      - name: Scannen
        run: |
          ./gitleaks git --config .gitleaks.toml \
            --report-format json --report-path gitleaks.json --redact --exit-code 0 --no-banner .
          [ -f gitleaks.json ] || echo '[]' > gitleaks.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secrets
          path: gitleaks.json
          if-no-files-found: error
          retention-days: 14

  # Gedragstests: statische scans zien geen autorisatiefouten. Daarom start deze job de app
  # op de wegwerp-runner en probeert .github/scripts/security_tests.py het misbruik echt.
  tests:
    name: Beveiligingstests (gedrag van de app)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: App starten
        run: docker network create websec-unbreakable-g08_default && docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Tests uitvoeren
        run: python3 .github/scripts/security_tests.py --base-url http://127.0.0.1:8080 --output tests.json

      - name: Logs van de app bij een fout
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 80

      - name: Opruimen
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests
          path: tests.json
          if-no-files-found: error
          retention-days: 14

  # Container scanning met Trivy. Twee controles, want ze zien verschillende dingen:
  #  - het Dockerfile: een ontbrekende USER (root) zie je in het gebouwde image niet terug
  #  - het image: bekende kwetsbaarheden en geheimen in de lagen
  container-scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy installeren (vaste versie, checksum gecontroleerd)
        run: |
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy

      # --skip-check-update: de controleregels van precies deze Trivy-versie, geen extra download.
      # --exit-code 0: de poort beslist, niet de scan.
      - name: Dockerfile controleren (misconfiguratie)
        run: |
          ./trivy config --skip-check-update --severity HIGH,CRITICAL \
            --format sarif --output trivy-dockerfile.json --exit-code 0 .

      - name: Image bouwen
        run: docker build -t unbreakable:scan app/

      - name: Image scannen (kwetsbaarheden, misconfiguratie en geheimen)
        run: |
          ./trivy image --severity HIGH,CRITICAL --scanners vuln,misconfig,secret \
            --format sarif --output trivy-container.json --exit-code 0 unbreakable:scan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-scan
          path: |
            trivy-dockerfile.json
            trivy-container.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Poort (nieuwe kritieke bevindingen)
    needs: [sca, sast, secrets, tests, container-scan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Een scan die zelf kapot ging mag nooit als "niets gevonden" tellen.
      - name: Alle scans moeten gelopen zijn
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::Een scan is niet geslaagd uitgevoerd: $RESULTS"
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: findings
          merge-multiple: true

      - name: Poort
        run: |
          python3 .github/scripts/security_gate.py \
            --accepted .security/accepted-findings.json \
            --sca findings/sca.json \
            --sast "findings/*.sarif" \
            --secrets findings/gitleaks.json \
            --tests findings/tests.json \
            --container "findings/trivy-*.json" \
            --min-sast-score "$SAST_MIN_SCORE"

  # Stap 3: uitrollen. Enkel na een geslaagde poort en enkel bij een push naar main.
  # De runner doet geen checkout en krijgt geen geheimen: hij geeft alleen de SHA door aan
  # een script dat root beheert (/usr/local/sbin/deploy-unbreakable.sh). Dat script haalt de
  # code zelf op en weigert elke commit die niet op main staat.
  # DSOMM: Deployment / "Automated deployment process" (L1)
  deploy:
    name: Uitrollen naar g08
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    concurrency:
      group: deploy-g08
      cancel-in-progress: false
    steps:
      - name: Uitrollen (enkel de commit die door de poort kwam)
        env:
          SHA: ${{ github.sha }}
        run: sudo -n /usr/local/sbin/deploy-unbreakable.sh "$SHA"